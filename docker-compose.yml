services:
  db:
    image: postgres:15-alpine
    container_name: docxtractor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docxtractor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docxtractor-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: docxtractor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - docxtractor-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: docxtractor-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - docxtractor-network
    command: pnpm run start:dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: docxtractor-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    env_file:
      - ./client/.env.local
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - docxtractor-network
    command: pnpm run dev

volumes:
  postgres_data:


networks:
  docxtractor-network:
    driver: bridge
