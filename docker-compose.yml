services:
  db:
    image: postgres:15-alpine
    container_name: docxtractor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docxtractor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docxtractor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: docxtractor-redis
    restart: unless-stopped
    command: redis-server --port 6380
    ports:
      - "6381:6380"
    networks:
      - docxtractor-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  freellm:
    image: ghcr.io/devansh-365/freellm:latest
    container_name: docxtractor-freellm
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
      - FREELLM_API_KEY=${FREELLM_API_KEY}
      - FREELLM_TOKEN_SECRET=${FREELLM_TOKEN_SECRET}
    networks:
      - docxtractor-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/v1/models"]
      interval: 15s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: docxtractor-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@db:5432/docxtractor
      - REDIS_HOST=redis
      - REDIS_PORT=6380
      - REDIS_URL=redis://redis:6380
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=http://localhost:9005
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=docxtractor-documents
      - FREELLM_BASE_URL=http://freellm:3000/v1
      - FREELLM_API_KEY=${FREELLM_API_KEY}
      - LLM_DEFAULT_MODEL=free
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-docxtractor-dev-access-secret}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-docxtractor-dev-refresh-secret}
      - JWT_RESET_SECRET=${JWT_RESET_SECRET:-docxtractor-dev-reset-secret}
      - FRONTEND_URL=http://localhost:5174
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - docxtractor-network
    command: pnpm run start:dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: docxtractor-client
    restart: unless-stopped
    ports:
      - "5174:5173"
    environment:
      - NODE_ENV=development
    env_file:
      - path: ./client/.env.local
        required: false
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - docxtractor-network
    command: pnpm run dev

  minio:
    image: minio/minio
    container_name: docxtractor-minio
    ports:
      - "9005:9000"
      - "9006:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - docxtractor-network

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " echo 'Waiting for MinIO...'; while ! /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin > /dev/null 2>&1; do
        sleep 2;
      done; /usr/bin/mc mb -p local/docxtractor-documents; /usr/bin/mc anonymous set public local/docxtractor-documents; exit 0; "
    networks:
      - docxtractor-network

  parser-service:
    build:
      context: ./workers/parser-service
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    environment:
      - PARSE_CACHE_ENABLED=false
      - PARSER_ENGINE=docling # markitdown | docling | pymupdf
      - REDIS_URL=redis://redis:6380
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=docxtractor-documents
      - PARSER_CONCURRENCY=1
      - DNNL_VERBOSE=0
      - LOG_LEVEL=INFO
      - PYTHONWARNINGS=ignore
      - PYTORCH_NO_NNPACK=1
      - TF_CPP_MIN_LOG_LEVEL=3
    networks:
      - docxtractor-network
    volumes:
      - ./workers/parser-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

  extraction-service:
    build:
      context: ./workers/extraction-service
    container_name: docxtractor-extractor
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    env_file:
      - path: ./workers/extraction-service/.env
        required: false
    environment:
      - REDIS_URL=redis://redis:6380
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - FREELLM_BASE_URL=http://freellm:3000/v1
      - FREELLM_API_KEY=${FREELLM_API_KEY}
      - LLM_DEFAULT_MODEL=free
      - EXTRACTION_CONCURRENCY=3
      - LOG_LEVEL=INFO
      - PYTHONWARNINGS=ignore
      - TF_CPP_MIN_LOG_LEVEL=3
    networks:
      - docxtractor-network
    volumes:
      - ./workers/extraction-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload

volumes:
  postgres_data:
  minio_data:

networks:
  docxtractor-network:
    driver: bridge
