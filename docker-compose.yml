services:
  db:
    image: postgres:15-alpine
    container_name: docxtractor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docxtractor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docxtractor-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: docxtractor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - docxtractor-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  maildev:
    image: maildev/maildev
    container_name: docxtractor-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - docxtractor-network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: docxtractor-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    networks:
      - docxtractor-network
    command: pnpm run start:dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: docxtractor-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    env_file:
      - ./client/.env.local
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - docxtractor-network
    command: pnpm run dev

  kafka:
    image: apache/kafka:3.7.0
    container_name: docxtractor-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft settings
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      # Single-node configuration
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - docxtractor-network

  minio:
    image: minio/minio
    container_name: docxtractor-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - docxtractor-network

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " echo 'Waiting for MinIO...'; while ! /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin > /dev/null 2>&1; do
        sleep 2;
      done; /usr/bin/mc mb -p local/docxtractor-documents; /usr/bin/mc anonymous set public local/docxtractor-documents; exit 0; "
    networks:
      - docxtractor-network

  init-kafka:
    image: apache/kafka:3.7.0
    container_name: docxtractor-kafka-init
    depends_on:
      - kafka
    entrypoint: [ "sh", "-c", "echo 'Waiting for Kafka...'; while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list > /dev/null 2>&1; do sleep 2; done; /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic docxtractor.documents.uploaded --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic docxtractor.documents.parsed --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic docxtractor.extraction.requests --partitions 1 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic docxtractor.extraction.completed --partitions 1 --replication-factor 1" ]
    networks:
      - docxtractor-network

  parser-service:
    build:
      context: ./workers/parser-service
    container_name: docxtractor-parser
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=docxtractor-documents
    networks:
      - docxtractor-network
    volumes:
      - ./workers/parser-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

  extraction-service:
    build:
      context: ./workers/extraction-service
    container_name: docxtractor-extractor
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    env_file:
      - ./workers/extraction-service/.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - LANGEXTRACT_MODEL_URL=http://host.docker.internal:11434
    networks:
      - docxtractor-network
    volumes:
      - ./workers/extraction-service:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002 --reload

volumes:
  postgres_data:
  minio_data:


networks:
  docxtractor-network:
    driver: bridge
