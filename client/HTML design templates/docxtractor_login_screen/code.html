<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>DocXTractor Login</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#fde047",
                        "background-light": "#ffffff",
                        "background-dark": "#201e12",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        'neobrutalism': '6px 6px 0px 0px #000000',
                        'neobrutalism-sm': '4px 4px 0px 0px #000000',
                        'neobrutalism-inset': 'inset 2px 2px 0px 0px rgba(0,0,0,0.1)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f0f0;
            background-image: radial-gradient(#000000 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .neo-input:focus {
            box-shadow: 4px 4px 0px 0px #000000;
            transform: translate(-2px, -2px);
            transition: all 0.1s ease;
        }
        .neo-button:active {
            box-shadow: 0px 0px 0px 0px #000000;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div class="relative w-full max-w-md bg-white border-4 border-black rounded-lg shadow-neobrutalism p-8 md:p-10">
<div class="flex flex-col items-center justify-center mb-8 gap-3">
<div class="bg-primary w-16 h-16 border-2 border-black rounded flex items-center justify-center shadow-neobrutalism-sm">
<span class="material-symbols-outlined text-4xl text-black">
                    description
                </span>
</div>
<div class="text-center mt-2">
<h1 class="text-3xl font-[800] text-black tracking-tight leading-none uppercase">DocXTractor</h1>
<p class="text-black font-medium text-sm mt-1">Extract data with confidence.</p>
</div>
</div>
<form class="flex flex-col gap-6">
<div class="flex flex-col gap-2">
<label class="text-black text-base font-bold uppercase tracking-wide" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-white border-2 border-black rounded px-4 py-3 h-12 text-black font-medium placeholder-gray-500 focus:outline-none focus:ring-0 focus:bg-yellow-50 focus:border-black transition-all shadow-neobrutalism-inset neo-input" id="email" placeholder="name@company.com" type="email"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-black pointer-events-none">
                        mail
                    </span>
</div>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-end">
<label class="text-black text-base font-bold uppercase tracking-wide" for="password">Password</label>
<a class="text-sm font-bold text-black hover:underline decoration-2 decoration-primary underline-offset-2" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full bg-white border-2 border-black rounded px-4 py-3 h-12 text-black font-medium placeholder-gray-500 focus:outline-none focus:ring-0 focus:bg-yellow-50 focus:border-black transition-all shadow-neobrutalism-inset neo-input" id="password" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-black pointer-events-none">
                        lock
                    </span>
</div>
</div>
<button class="mt-2 w-full h-14 bg-primary text-black text-lg font-[800] uppercase tracking-wide border-2 border-black rounded shadow-neobrutalism-sm neo-button transition-transform flex items-center justify-center gap-2 hover:bg-[#fde667]" type="button">
                Sign In
                <span class="material-symbols-outlined font-bold">
                    login
                </span>
</button>
</form>
<div class="mt-8 flex flex-col gap-4">
<div class="relative flex items-center">
<div class="flex-grow border-t-2 border-black"></div>
<span class="flex-shrink mx-4 text-xs font-bold uppercase tracking-widest text-black">Or sign in quickly</span>
<div class="flex-grow border-t-2 border-black"></div>
</div>
<button class="w-full h-12 bg-white text-black text-sm font-bold uppercase tracking-wide border-2 border-black rounded shadow-neobrutalism-sm neo-button transition-transform flex items-center justify-center gap-2 hover:bg-gray-50" type="button">
<span class="material-symbols-outlined text-xl">person_search</span>
                Login as Guest
            </button>
<div class="grid grid-cols-2 gap-4">
<button class="h-12 bg-white text-black text-sm font-bold border-2 border-black rounded shadow-neobrutalism-sm neo-button transition-transform flex items-center justify-center gap-2 hover:bg-gray-50" type="button">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDG90Z0AqtXTsKm_McnzdJ534I7h656CC9oy9GK-L8ZmZ8LkmZRDXDuni-Z29mx0GbXvC9pBPIYa9JcxHyhBT7vkzXss60ytmXn70RiwQFONlZ2pbVv1sR_iA5RAfqJTDq72dxwRd6Q3UDl7hwzWCZ-d5OY-h3MiqHgRKrohV5Z8nLrHF8pSR2I-SKHwmS0Dqe2nNqQglAEBgT4ybbGq_eWDYduq4useGThVgxApzxbhshN5zeCbFU9jdehEln6RYHmgpexMGGhBbhx"/>
                    Google
                </button>
<button class="h-12 bg-white text-black text-sm font-bold border-2 border-black rounded shadow-neobrutalism-sm neo-button transition-transform flex items-center justify-center gap-2 hover:bg-gray-50" type="button">
<img alt="GitHub" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJMUz9gnmwg2rNWmZTwqtnrpb-7giKFAZA2FQ5iLbnFL2AnvM80PlQagw4RlysOaUuNFpuBd-FZ_53Z_MRstAWnXOCnGc4Uv3sXHD2sTF2QpVvJneQWcl9qNDsqfn8kJ_5ILp00--7Mu8bGKxAuhJMj-epmz8AFjYOnPPIJQlAfGBbfclxdb56VeuZe1-PYMNcdhzTQ1si-_1K02q8KuCrgZqaEfWT_wJKS2rt4x-diDQNrMxd_bzy9FEkAAPmByT5Y651eWk4vo_i"/>
                    GitHub
                </button>
</div>
</div>
<div class="mt-8 pt-6 border-t-2 border-black flex justify-center">
<p class="text-black font-medium text-sm">
                Don't have an account? 
                <a class="font-bold underline decoration-2 decoration-primary underline-offset-4 hover:bg-primary hover:text-black transition-colors px-1" href="#">Sign Up</a>
</p>
</div>
<div class="absolute -top-3 -left-3 w-6 h-6 bg-black rounded-full border-2 border-white z-10"></div>
<div class="absolute -top-3 -right-3 w-6 h-6 bg-black rounded-full border-2 border-white z-10"></div>
<div class="absolute -bottom-3 -left-3 w-6 h-6 bg-black rounded-full border-2 border-white z-10"></div>
<div class="absolute -bottom-3 -right-3 w-6 h-6 bg-black rounded-full border-2 border-white z-10"></div>
</div>

</body></html>
