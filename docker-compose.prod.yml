services:
  db:
    image: postgres:15-alpine
    container_name: docxtractor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docxtractor-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: docxtractor-redis
    restart: unless-stopped
    command: redis-server --port 6379
    volumes:
      - redis_data:/data
    networks:
      - docxtractor-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z-cpuv1
    container_name: docxtractor-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - docxtractor-network

  createbuckets:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z-cpuv1
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      while ! /usr/bin/mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} > /dev/null 2>&1; do
        sleep 2;
      done;
      /usr/bin/mc mb -p local/docxtractor-documents;
      /usr/bin/mc anonymous set public local/docxtractor-documents;
      exit 0;
      "
    networks:
      - docxtractor-network

  server:
    image: ghcr.io/${GHCR_OWNER:-iamsal}/docxtractor-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: docxtractor-server
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=docxtractor-db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@docxtractor-db:5432/${DB_NAME}
      - REDIS_HOST=docxtractor-redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://docxtractor-redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=docxtractor-documents
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_EXPIRES_IN=1h
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-qwen3:14b}
      - OLLAMA_GENERATION_MODEL=${OLLAMA_GENERATION_MODEL:-qwen3:14b}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    networks:
      - docxtractor-network

  client:
    image: ghcr.io/${GHCR_OWNER:-iamsal}/docxtractor-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    container_name: docxtractor-client
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NITRO_PORT=3000
    depends_on:
      - server
    networks:
      - docxtractor-network

  parser-service:
    image: ghcr.io/${GHCR_OWNER:-iamsal}/docxtractor-parser:latest
    build:
      context: ./workers/parser-service
    container_name: docxtractor-parser
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    environment:
      - REDIS_URL=redis://docxtractor-redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=docxtractor-documents
      - PARSER_CONCURRENCY=4
    networks:
      - docxtractor-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001

  extraction-service:
    image: ghcr.io/${GHCR_OWNER:-iamsal}/docxtractor-extractor:latest
    build:
      context: ./workers/extraction-service
    container_name: docxtractor-extractor
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully
    environment:
      - REDIS_URL=redis://docxtractor-redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LANGEXTRACT_API_KEY=${LANGEXTRACT_API_KEY}
      - LANGEXTRACT_MODEL_URL=${OLLAMA_HOST}
    networks:
      - docxtractor-network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8002

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  docxtractor-network:
    driver: bridge
