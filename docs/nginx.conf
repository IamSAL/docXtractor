 server {
      listen 80 default_server;                                            
      listen [::]:80 default_server;                                       
      listen 443 default_server ssl;
      listen [::]:443 default_server ssl;                                  
      ssl_reject_handshake on;
      server_name _;                                                       
      return 444;                                                          
  }
                                         
  server {
      listen 80;
      listen [::]:80;                                                      
      server_name docxtractor.sk-salman.com;
      return 301 https://$host$request_uri;                                
  }                                                                        

  server {                               
      listen 443 ssl;
      listen [::]:443 ssl;
      server_name docxtractor.sk-salman.com;                               
   
      ssl_certificate                                                      
  /etc/letsencrypt/live/docxtractor.sk-salman.com/fullchain.pem;           
      ssl_certificate_key
  /etc/letsencrypt/live/docxtractor.sk-salman.com/privkey.pem;             
      include /etc/letsencrypt/options-ssl-nginx.conf;
      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                       
                                                                           
      client_max_body_size 100M;
                                                                           
      location /socket.io/ {                                               
          proxy_pass         http://127.0.0.1:3001;
          proxy_http_version 1.1;        
          proxy_set_header   Upgrade $http_upgrade;                        
          proxy_set_header   Connection "upgrade";
          proxy_set_header   Host $host;                                   
          proxy_set_header   X-Real-IP $remote_addr;                       
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header   X-Forwarded-Proto $scheme;                    
          proxy_read_timeout 3600s;
      }                                                                    
                                                                           
      location /api/ {
          proxy_pass         http://127.0.0.1:3001/;
          proxy_http_version 1.1;                                          
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;                       
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;   
          proxy_set_header   X-Forwarded-Proto $scheme;                    
      }                                  
                                                                           
      location / {                                                         
          proxy_pass         http://127.0.0.1:3000;
          proxy_http_version 1.1;                                          
          proxy_set_header   Upgrade $http_upgrade;
          proxy_set_header   Connection "upgrade";                         
          proxy_set_header   Host $host;                                   
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;   
          proxy_set_header   X-Forwarded-Proto $scheme;
      }                                                                    
  }                                                                        

  server {                               
      listen 80;
      listen [::]:80;                                                      
      server_name freellm.sk-salman.com;
      return 301 https://$host$request_uri;                                
  }                                                                        

  server {                               
      listen 443 ssl;
      listen [::]:443 ssl;
      server_name freellm.sk-salman.com;                                   
   
      ssl_certificate                                                      
  /etc/letsencrypt/live/freellm.sk-salman.com/fullchain.pem;               
      ssl_certificate_key
  /etc/letsencrypt/live/freellm.sk-salman.com/privkey.pem;                 
      include /etc/letsencrypt/options-ssl-nginx.conf;
      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                       
                                                                           
      location / {
          proxy_pass         http://127.0.0.1:3002;                        
          proxy_http_version 1.1;                                          
          proxy_set_header   Host $host;
          proxy_set_header   X-Real-IP $remote_addr;
          proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;   
          proxy_set_header   X-Forwarded-Proto $scheme;
      }                                                                    
  }