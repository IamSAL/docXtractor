  #     - name: Lint Client
  #       working-directory: client
  #       run: pnpm install --frozen-lockfile && pnpm run check

  deploy:
    # needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            cd ${{ secrets.PROJECT_DIR }}

            # Save current HEAD before pulling to detect changes
            PREV_SHA=$(git rev-parse HEAD)
            git pull origin main
            CURR_SHA=$(git rev-parse HEAD)

            # Write production .env from secret
            echo "${{ secrets.ENV_FILE_CONTENT_SERVER }}" > ./server/.env

            # Detect which services changed since last deploy
            CHANGED=$(git diff --name-only "$PREV_SHA" "$CURR_SHA")
            BUILD_SERVICES=""

            if echo "$CHANGED" | grep -q "^server/"; then
              BUILD_SERVICES="$BUILD_SERVICES server"
            fi
            if echo "$CHANGED" | grep -q "^client/"; then
              BUILD_SERVICES="$BUILD_SERVICES client"
            fi
            if echo "$CHANGED" | grep -q "^workers/parser-service/"; then
              BUILD_SERVICES="$BUILD_SERVICES parser-service"
            fi
            if echo "$CHANGED" | grep -q "^workers/extraction-service/"; then
              BUILD_SERVICES="$BUILD_SERVICES extraction-service"
            fi
            if echo "$CHANGED" | grep -q "^nginx/"; then
              BUILD_SERVICES="$BUILD_SERVICES nginx"
            fi
            # Changes to docker-compose or root config should rebuild all
            if echo "$CHANGED" | grep -q "^docker-compose.prod.yml$"; then
              BUILD_SERVICES="server client parser-service extraction-service nginx"
            fi

            if [ -n "$BUILD_SERVICES" ]; then
              echo "Building changed services:$BUILD_SERVICES"
              docker compose -f docker-compose.prod.yml build $BUILD_SERVICES
            else
              echo "No service changes detected, skipping builds."
            fi

            # Start/restart services (unchanged ones reuse existing images)
            docker compose -f docker-compose.prod.yml up -d

            # Wait for health checks to pass
            echo "Waiting for services to become healthy..."
            sleep 15

            # Verify critical containers are running
            for container in docxtractor-server docxtractor-client docxtractor-db docxtractor-redis docxtractor-nginx docxtractor-parser docxtractor-extractor; do
              if ! docker ps --format '{{.Names}}' | grep -q "^${container}$"; then
                echo "ERROR: ${container} is not running!"
                docker logs "${container}" --tail 30 2>&1 || true
                exit 1
              fi
            done
            echo "All containers are running."

            # Cleanup old images and build cache
            docker image prune -f
            docker builder prune -f --filter "until=168h"
